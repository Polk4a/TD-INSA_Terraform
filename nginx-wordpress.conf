# sti-wp01 : site WordPress (nginx + php-fpm)
# Installé par wp-bootstrap.sh ; __PHP_FPM_SOCK__ y est remplacé par le socket
# de la version de PHP réellement installée.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root  /var/www/wordpress;
    index index.php;

    # Envoi de médias (le défaut nginx est de 1 Mo)
    client_max_body_size 64m;

    # Sonde de santé pour HAProxy : option httpchk GET /healthz
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers cachés interdits (sauf /.well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Jamais de PHP exécuté dans les uploads (doit rester AVANT le bloc \.php$)
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_param PHP_VALUE "upload_max_filesize=64M \n post_max_size=64M";
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
